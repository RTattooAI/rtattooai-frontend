server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # La aplicación sube fotografías de hasta 10 MB; el límite por defecto de nginx
    # (1 MB) las rechazaría con un 413 antes de llegar al backend.
    client_max_body_size 12m;

    # Nada de esta aplicación debe poder embeberse en otro sitio ni filtrar la ruta
    # visitada a terceros. La CSP permite solo recursos propios: el bundle de Angular
    # es autocontenido y las imágenes llegan por /api/files del mismo origen.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # camera=(self): la captura de fotografías desde el dispositivo es una función del
    # sistema (RF-01). Con camera=() el navegador bloquea getUserMedia aunque el usuario
    # conceda el permiso. Micrófono y ubicación siguen bloqueados.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), interest-cohort=()" always;
    # font-src incluye fonts.gstatic.com porque index.html referencia Google Fonts
    # (IBM Plex Sans/Mono, Roboto); sin este dominio la CSP bloquea los .woff2 y el
    # texto cae a fuentes genéricas. Para volver a 'self' puro habría que self-hostear
    # esos archivos como asset local del build.
    # img-src y connect-src admiten Azure Blob Storage: en Azure (Storage__Provider=azure)
    # las imágenes llegan como URL SAS de *.blob.core.windows.net; en el despliegue
    # propio se sirven desde /api/files ('self'). connect-src lo necesita el reporte
    # PDF, que descarga las imágenes con fetch.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.blob.core.windows.net; media-src 'self' blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.blob.core.windows.net; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Oculta la versión de nginx en las respuestas de error.
    server_tokens off;

    # "^~" es imprescindible: sin el, /api/files/.../original.png termina en el bloque
    # de recursos estaticos de mas abajo (que casa por extension) y nunca llega al
    # backend, de modo que ninguna imagen del sistema se muestra.
    location ^~ /api/ {
        proxy_pass ${BACKEND_URL}/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host ${BACKEND_HOST};
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        # El backend limita los intentos de login por IP: sin esta cabecera todos
        # los clientes compartirían la IP del proxy.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El análisis completo (detección + identificación) puede tardar varios
        # segundos, y más aún en el primer arranque del servicio de IA.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Nota: nginx solo hereda los add_header del nivel superior cuando el bloque
    # actual no define ninguno. Por eso la cache se ajusta con "expires" y no con
    # add_header: asi las cabeceras de seguridad siguen aplicandose aqui.

    # Recursos con hash en el nombre: se pueden cachear con holgura.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        # index.html no se cachea: es lo que apunta al bundle vigente.
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
