<div class="rounded-md px-3 py-2.5 flex items-start gap-2.5 ring-1" [class]="style().container">
  <span class="w-2.5 h-2.5 rounded-full mt-1 shrink-0" [class]="style().dot"></span>
  <div class="min-w-0">
    <div class="text-[12px] font-bold uppercase tracking-wider" [class]="style().text">{{ style().label }}</div>
    <p class="text-[12px] leading-snug mt-0.5" [class]="style().text">{{ message() }}</p>
  </div>
</div>
