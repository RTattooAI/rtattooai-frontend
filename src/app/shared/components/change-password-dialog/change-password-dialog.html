<div class="fixed inset-0 z-50 grid place-items-center bg-navy-950/50 backdrop-blur-sm p-4">
  <form class="bg-white rounded-lg shadow-lg w-full max-w-md p-5" (submit)="onSubmit($event)" novalidate>
    <div class="flex items-start justify-between gap-4 mb-4">
      <div>
        <h3 class="text-[15px] font-semibold text-navy-900 flex items-center gap-1.5">
          <app-icon name="key-round" [size]="15" class="text-slate-400" /> Cambiar contraseña
        </h3>
        <p class="text-[12px] text-slate-500 mt-0.5">
          Al menos 8 caracteres, combinando letras y números. No puede contener su correo.
        </p>
      </div>
      <button type="button" (click)="closed.emit()" class="p-1 text-slate-400 hover:text-slate-700 rounded" title="Cerrar">
        <app-icon name="x" [size]="16" />
      </button>
    </div>

    <label class="block text-[12px] font-medium text-slate-600 mb-1" for="cp-actual">Contraseña actual</label>
    <input
      id="cp-actual"
      type="password"
      autocomplete="current-password"
      [value]="currentPassword()"
      (input)="onCurrentInput($event)"
      class="w-full px-3 py-2 text-[13px] bg-slate-50 border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-accent/30"
    />

    <label class="block text-[12px] font-medium text-slate-600 mb-1 mt-3" for="cp-nueva">Nueva contraseña</label>
    <input
      id="cp-nueva"
      type="password"
      autocomplete="new-password"
      [value]="newPassword()"
      (input)="onNewInput($event)"
      class="w-full px-3 py-2 text-[13px] bg-slate-50 border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-accent/30"
    />

    <label class="block text-[12px] font-medium text-slate-600 mb-1 mt-3" for="cp-confirmacion">Repita la nueva contraseña</label>
    <input
      id="cp-confirmacion"
      type="password"
      autocomplete="new-password"
      [value]="confirmation()"
      (input)="onConfirmationInput($event)"
      class="w-full px-3 py-2 text-[13px] bg-slate-50 border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-accent/30"
    />

    @if (problem()) {
      <p class="mt-3 px-3 py-2 rounded-md bg-amber-50 border border-amber-200 text-[12px] text-amber-800" role="status">
        {{ problem() }}
      </p>
    }

    @if (error()) {
      <p class="mt-3 px-3 py-2 rounded-md bg-rose-50 border border-rose-200 text-[12px] text-rose-700" role="alert">
        {{ error() }}
      </p>
    }

    <div class="mt-4 flex items-center justify-end gap-2">
      <button type="button" (click)="closed.emit()" class="px-3 py-2 text-[13px] font-medium text-slate-600 hover:bg-slate-100 rounded-md">
        Cancelar
      </button>
      <button
        type="submit"
        [disabled]="!canSubmit()"
        class="px-3.5 py-2 text-[13px] font-semibold text-white bg-navy-800 hover:bg-navy-900 disabled:bg-slate-300 rounded-md flex items-center gap-1.5"
      >
        @if (isSubmitting()) {
          <app-icon name="loader" [size]="14" class="spin" /> Guardando…
        } @else {
          Cambiar contraseña
        }
      </button>
    </div>
  </form>
</div>
